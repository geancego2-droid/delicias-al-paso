<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Control de Stock{% endblock %}</title>
<style>
:root{--green:#174d38;--pale:#edf5ef;--ink:#1f2933;--muted:#64748b;--line:#dbe4de}*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#f6f8f6}.top{background:var(--green);color:white;padding:18px max(18px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top a{color:white;text-decoration:none;margin-right:14px}.wrap{max-width:1120px;margin:26px auto;padding:0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 6px #183b2a08}.muted{color:var(--muted);font-size:13px}.num{font-size:26px;font-weight:750;margin-top:8px}.btn{display:inline-block;background:var(--green);color:white;padding:10px 14px;border-radius:8px;text-decoration:none}.warn{color:#9a3412;background:#fff7ed;padding:9px;border-radius:8px;margin:6px 0}table{border-collapse:collapse;width:100%;background:white}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}footer{color:var(--muted);text-align:center;padding:30px;font-size:12px}
</style></head><body><header class="top"><div><strong>▣ CONTROL DE STOCK</strong><div style="font-size:12px;opacity:.8">Almacén · Paraguay · Gs.</div></div><nav><a href="/">Inicio</a><a href="/admin/">Administrar módulos</a>{% if user.is_authenticated %}<span>{{ user.username }}</span> <a href="/accounts/logout/">Salir</a>{% endif %}</nav></header><main class="wrap">{% block content %}{% endblock %}</main><footer>Control de Stock · Zona horaria Paraguay · Montos expresados en guaraníes</footer></body></html>
