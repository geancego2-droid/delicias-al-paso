databases:
  - name: delicias-stock-db
    databaseName: delicias_stock
    user: delicias_stock_user
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: delicias-stock
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: delicias-stock.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://delicias-stock.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: delicias-stock-db
          property: connectionString
